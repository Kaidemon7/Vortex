            <button onclick="document.body.style.backgroundColor='yellow'; document.getElementById('kaidgaming').style.color='yellow';" style="background-color:grey; outline:2px solid red; width:200px; height:50px; font-size:20px;">Yellow</button>

        <script type="module">
            import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
            import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-analytics.js";
            import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";
            import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

            const firebaseConfig = {
                apiKey: "AIzaSyAjjoLkq9VTI3FA6TzzjvT44sNdl-xRc14",
                authDomain: "kaid-gaming-v3.firebaseapp.com",
                databaseURL: "https://kaid-gaming-v3-default-rtdb.firebaseio.com",
                projectId: "kaid-gaming-v3",
                storageBucket: "kaid-gaming-v3.firebasestorage.app",
                messagingSenderId: "443033890269",
                appId: "1:443033890269:web:f8e87ce0248e0f90acda34",
                measurementId: "G-30W4JMEVDE"
            };

            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const analytics = getAnalytics(app);
            const db = getDatabase(app);

            window.checkLogin = function () {
                const username = document.getElementById("username").value;
                const email = username + "@kaidgaming.com";
                const password = document.getElementById("password").value;

                createUserWithEmailAndPassword(auth, email, password)
                    .then(() => {
                        alert("Account created!");
                        loggedIn = true;
                        window.username = username;
                        document.getElementById("home").style.display = "none";
                        document.getElementById("Games").style.display = "block";
                    })
                    .catch((error) => {
                        if (error.code === "auth/email-already-in-use") {
                            signInWithEmailAndPassword(auth, email, password)
                                .then(() => {
                                    alert("Logged in!");
                                    loggedIn = true;
                                    window.username = username;
                                    document.getElementById("home").style.display = "none";
                                    document.getElementById("Games").style.display = "block";
                                })
                                .catch(() => {
                                    alert("Wrong password!");
                                });
                        } else {
                            alert(error.message);
                        }
                    });
            };

            window.sendMessage = function () {
                const message = document.getElementById("message").value;

                if (message.trim() === "") return;

                push(ref(db, "chat"), {
                    username: window.username,
                    message: message
                });

                document.getElementById("message").value = "";
            };

            onChildAdded(ref(db, "chat"), (snapshot) => {
                const data = snapshot.val();

                document.getElementById("chatBox").innerHTML +=
                    "<p><b style='color:red;'>" + data.username + ":</b> " + data.message + "</p>";

                document.getElementById("chatBox").scrollTop =
                    document.getElementById("chatBox").scrollHeight;
            });
        </script>
    </div>
